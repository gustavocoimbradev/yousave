<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>YouSave</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="logoGrad" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FF5B5B"/>
              <stop offset="1" stop-color="#C4001D"/>
            </linearGradient>
          </defs>
          <rect x="0.5" y="0.5" width="39" height="39" rx="11" fill="url(#logoGrad)"/>
          <path d="M20 10.5v10.5" stroke="#fff" stroke-width="3.3" stroke-linecap="round"/>
          <path d="M12.5 18.5 20 26l7.5-7.5" fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22.6 20.6a3 3 0 1 1-5.2 0 3 3 0 0 1 5.2 0Z" fill="url(#logoGrad)"/>
          <path d="M12.5 30.5h15" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span class="title">YouSave</span>
      </div>
      <div class="win-controls">
        <button class="win-btn" id="winMin" title="Minimizar" aria-label="Minimizar">
          <svg viewBox="0 0 10 10"><path d="M1.5 5h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button class="win-btn win-close" id="winClose" title="Fechar" aria-label="Fechar">
          <svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main>
      <div class="field">
        <label for="url">Link do vídeo</label>
        <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autofocus autocomplete="off" spellcheck="false" />
      </div>

      <label class="toggle">
        <input id="mp3" type="checkbox" />
        <span>Baixar somente áudio (MP3)</span>
      </label>

      <div class="field">
        <label for="saveDir">Salvar em</label>
        <div class="save-row">
          <svg class="save-row-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
          <span id="saveDir" class="save-path"></span>
          <button id="changeDir" type="button">Alterar</button>
        </div>
      </div>

      <button id="download">Baixar</button>

      <p id="inlineError" class="inline-error"></p>
    </main>
  </div>

  <div id="overlay" class="overlay">
    <div class="dialog">
      <div class="dialog-icon" id="dialogIcon">
        <div class="spinner"></div>
      </div>

      <h2 id="dialogTitle">Preparando download…</h2>
      <p id="dialogSubtitle" class="dialog-subtitle">Obtendo informações do vídeo</p>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-meta">
        <span id="progressPercent">0%</span>
        <span id="progressSpeed"></span>
      </div>

      <div id="dialogFolder" class="dialog-folder">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span id="folderPath"></span>
      </div>

      <div class="dialog-actions">
        <button id="dialogCancel" class="btn-secondary">Cancelar</button>
        <button id="dialogOpenFolder" class="btn-primary hidden">Abrir pasta</button>
        <button id="dialogClose" class="btn-primary hidden">Concluir</button>
      </div>
    </div>
  </div>

  <div id="updateOverlay" class="overlay">
    <div class="dialog">
      <div class="dialog-icon" id="updateIcon">
        <div class="spinner"></div>
      </div>

      <h2 id="updateTitle">Atualização disponível</h2>
      <p id="updateSubtitle" class="dialog-subtitle">Baixando atualização…</p>

      <div class="progress-track">
        <div class="progress-fill" id="updateProgressFill"></div>
      </div>
      <div class="progress-meta">
        <span id="updateProgressPercent">0%</span>
        <span></span>
      </div>

      <div class="dialog-actions hidden" id="updateActions">
        <button id="updateDismiss" class="btn-primary">Continuar</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
